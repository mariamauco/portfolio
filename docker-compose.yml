version: '3.8'

services:
  # Development Service (Run this locally or when debugging)
  web-dev:
    build:
      context: .
      target: dev
    # Map to a different port (e.g., 3001) to avoid conflict with prod
    ports:
      - "3001:3000" 
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Do not auto-restart dev; we want to see errors immediately
    restart: "no" 

  # Production Service (Run this on 'jewellbase')
  web-prod:
    container_name: portfolio
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    # This replaces PM2! Docker will automatically restart the app if it crashes or the server reboots.
    restart: always 
    environment:
      - NODE_ENV=production

  backend-dev:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./myapp-backend:/app
      - /app/node_modules
    command: sh -c "npm install && node app.js"
    ports:
      - "3300:3300"
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 3100
      POSTGRES_USER: maria
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portfolio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  backend-prod:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./myapp-backend:/app
      - /app/node_modules
    command: sh -c "npm install --omit=dev && node app.js"
    ports:
      - "3301:3300"
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 3100
      POSTGRES_USER: maria
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portfolio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
